services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        OCR_EXTRA: ${OCR_EXTRA:-cu126}

  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        OCR_EXTRA: ${OCR_EXTRA:-cu126}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        OCR_EXTRA: ${OCR_EXTRA:-cu126}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

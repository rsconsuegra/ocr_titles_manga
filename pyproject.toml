[project]
name = "ocr-manga-title"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "dramatiq[redis]>=1.17.0",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "openai>=2.32.0",
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
cpu = [
    "easyocr>=1.7.2 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "paddlepaddle==3.3.0 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "paddleocr>=2.10,<3 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "pytesseract>=0.3.13",
    "torch>=2.6.0 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "torchvision>=0.20.0 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
]
cu126 = [
    "easyocr>=1.7.2",
    "paddleocr>=2.10,<3",
    "paddlepaddle-gpu==3.3.0 ; sys_platform == 'linux'",
    "pytesseract>=0.3.13",
    "torch>=2.6.0",
    "torchvision>=0.20.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "bandit[toml]>=1.9.0",
    "httpx>=0.28.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.6",
    "mypy>=1.14.0",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "types-pyyaml>=6.0.12.20260408",
    "types-redis>=4.6.0.20241004",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name="paddle-cpu"
url="https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cu126" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
paddlepaddle = [
  { index = "paddle-cpu", extra = "cpu" },
]
paddlepaddle-gpu = [
  { index = "paddle-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

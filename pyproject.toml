[project]
name = "ocr-manga-title"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "dramatiq[redis]>=1.17.0",
    "fastapi>=0.115.0",
    "jupyterlab>=4.5.6",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "openai>=2.32.0",
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34.0",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "bandit[toml]>=1.9.0",
    "httpx>=0.28.0",
    "jupyter>=1.1.1",
    "mypy>=1.14.0",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
